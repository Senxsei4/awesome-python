name: Build & Publish Oracle

# One tag (oracle-v*) builds and publishes the whole stack:
#   * build-exe   -> OracleAI.exe + Desktop-icon installer (Windows runner)
#   * build-panel -> control-panel Docker image -> GitHub Container Registry
# PyInstaller can't cross-compile, so the exe must run on a Windows runner.
on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    tags:
      - "oracle-v*"          # e.g. oracle-v24.7 -> Release + published image

permissions:
  contents: write           # attach binaries to a Release on tag
  packages: write           # push the control-panel image to ghcr.io

concurrency:
  group: build-publish-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: oracle_citadel
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies + build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build OracleAI.exe
        run: pyinstaller --noconfirm --clean oracle_citadel.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: OracleAI-exe
          path: oracle_citadel/dist/OracleAI.exe
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Desktop + Start Menu shortcuts)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OracleAI-Setup
          path: oracle_citadel/Output/OracleAI-Setup.exe
          if-no-files-found: error

      - name: Attach binaries to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/oracle-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oracle_citadel/dist/OracleAI.exe
            oracle_citadel/Output/OracleAI-Setup.exe

  build-panel:
    # Builds the control-panel image; pushes to ghcr.io on tag, build-only
    # otherwise (so manual runs still validate the Dockerfile).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/oracle-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oracle-control-panel
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/oracle-v') }}
            type=sha

      - name: Build (and push on tag) the control-panel image
        uses: docker/build-push-action@v6
        with:
          context: control_panel
          push: ${{ startsWith(github.ref, 'refs/tags/oracle-v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
