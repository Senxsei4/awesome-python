<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oracle AI — Control Panel</title>
<style>
  :root {
    --bg: #0A0E17; --panel: #121A2F; --blue: #00E5FF; --red: #FF3366;
    --green: #00FFAA; --text: #E0E6ED; --muted: #6B7A90;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Segoe UI", Arial, sans-serif; }
  header { background: var(--panel); padding: 16px 24px; display: flex;
           align-items: center; gap: 16px; flex-wrap: wrap;
           border-bottom: 1px solid #1e2a47; }
  header h1 { font-family: "Courier New", monospace; color: var(--blue);
              font-size: 22px; margin: 0; letter-spacing: 1px; }
  header .spacer { flex: 1; }
  input, select { background: var(--bg); color: var(--text);
    border: 1px solid #28344f; border-radius: 6px; padding: 8px 10px; font-size: 14px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
          padding: 24px; max-width: 1100px; margin: 0 auto; }
  .card { background: var(--panel); border-radius: 12px; padding: 20px; }
  .card h2 { margin: 0 0 16px; font-size: 15px; color: var(--muted);
             text-transform: uppercase; letter-spacing: 1px; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { cursor: pointer; border: none; border-radius: 8px; padding: 14px;
           font-size: 15px; font-weight: bold; color: #04121a; background: var(--blue);
           transition: transform .05s ease; }
  button:active { transform: scale(.97); }
  button.danger { background: var(--red); color: #fff; }
  button.ghost { background: var(--bg); color: var(--text); border: 1px solid #28344f; }
  .row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
  .row > div { flex: 1; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  .toggles button { font-size: 13px; padding: 8px 12px; }
  #log { font-family: "Courier New", monospace; font-size: 12px;
         max-height: 420px; overflow-y: auto; }
  .ev { padding: 8px 10px; border-bottom: 1px solid #1c2742; }
  .ev .t { color: var(--muted); }
  .ev .k { color: var(--blue); font-weight: bold; }
  #toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel);
           border: 1px solid var(--blue); color: var(--text); padding: 12px 18px;
           border-radius: 8px; opacity: 0; transition: opacity .3s; }
  #toast.show { opacity: 1; }
  .depth { color: var(--green); font-weight: bold; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>◎ ORACLE CONTROL</h1>
  <div><label>Operator (user)</label><input id="user" placeholder="alice"></div>
  <div><label>Panel key</label><input id="pkey" type="password" placeholder="panel password"></div>
  <button class="ghost" onclick="saveCreds()">Save</button>
  <div class="spacer"></div>
  <div><label>Queue depth</label><span id="depth" class="depth">—</span></div>
</header>

<div class="wrap">
  <div class="card">
    <h2>Directives</h2>
    <div class="btn-grid">
      <button onclick="send('resume')">▶ RESUME</button>
      <button class="ghost" onclick="send('pause')">⏸ PAUSE</button>
      <button class="ghost" onclick="send('report')">📊 EOD REPORT</button>
      <button class="ghost" onclick="send('status')">🛰 STATUS</button>
      <button class="danger" style="grid-column:1/3" onclick="confirmFlat()">🛑 FLATTEN PORTFOLIO</button>
    </div>

    <h2 style="margin-top:24px">Live Config</h2>
    <div class="row">
      <div><label>Base risk %</label><input id="risk" type="number" step="0.1" placeholder="1.0"></div>
      <div><label>Max port risk %</label><input id="maxport" type="number" step="0.5" placeholder="15.0"></div>
      <button onclick="applyRisk()">APPLY</button>
    </div>
    <label>Toggle (sends set_config)</label>
    <div class="toggles">
      <button class="ghost" onclick="toggle('route_mt5', true)">MT5 ON</button>
      <button class="ghost" onclick="toggle('route_mt5', false)">MT5 OFF</button>
      <button class="ghost" onclick="toggle('trade_chop', false)">NO CHOP</button>
      <button class="ghost" onclick="toggle('trade_chop', true)">CHOP ON</button>
      <button class="ghost" onclick="toggle('kelly_active', true)">KELLY ON</button>
      <button class="ghost" onclick="toggle('kelly_active', false)">KELLY OFF</button>
      <button class="ghost" onclick="toggle('grid_active', true)">GRID ON</button>
      <button class="ghost" onclick="toggle('grid_active', false)">GRID OFF</button>
    </div>
  </div>

  <div class="card">
    <h2>Event Feed (from Oracle)</h2>
    <div id="log"></div>
  </div>
</div>

<div id="toast"></div>

<script>
function $(id){ return document.getElementById(id); }
function saveCreds(){
  localStorage.setItem('oc_user', $('user').value.trim());
  localStorage.setItem('oc_pkey', $('pkey').value);
  toast('Credentials saved locally');
}
function loadCreds(){
  $('user').value = localStorage.getItem('oc_user') || '';
  $('pkey').value = localStorage.getItem('oc_pkey') || '';
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function headers(){
  return { 'Content-Type': 'application/json', 'X-Panel-Key': $('pkey').value };
}
async function enqueue(body){
  const user = $('user').value.trim();
  if(!user){ toast('Enter an operator (user) first'); return; }
  body.user = user;
  try {
    const r = await fetch('/api/panel/enqueue', {method:'POST', headers: headers(), body: JSON.stringify(body)});
    const j = await r.json();
    if(!r.ok){ toast('Error: ' + (j.error || r.status)); return; }
    toast('Queued: ' + body.command + (body.settings ? ' ' + JSON.stringify(body.settings) : ''));
  } catch(e){ toast('Network error'); }
}
function send(command){ enqueue({command}); }
function confirmFlat(){ if(confirm('Flatten the entire portfolio for this operator?')) send('flat'); }
function applyRisk(){
  const s = {};
  if($('risk').value !== '') s.risk_pct = parseFloat($('risk').value);
  if($('maxport').value !== '') s.max_port_risk = parseFloat($('maxport').value);
  if(Object.keys(s).length === 0){ toast('Enter a value first'); return; }
  enqueue({command:'set_config', settings: s});
}
function toggle(key, val){ enqueue({command:'set_config', settings: {[key]: val}}); }

async function refresh(){
  try {
    const r = await fetch('/api/panel/state', {headers: headers()});
    if(!r.ok) return;
    const j = await r.json();
    const user = $('user').value.trim();
    $('depth').textContent = (j.queue_depth && j.queue_depth[user]) || 0;
    const log = $('log');
    log.innerHTML = (j.events || []).map(e => {
      const p = e.payload || {};
      const evt = p.event || 'event';
      const data = JSON.stringify(p.data || p);
      return `<div class="ev"><span class="t">${(e.received||'').replace('T',' ').slice(0,19)}</span>
              &nbsp;<span class="k">${evt}</span>&nbsp;${data}</div>`;
    }).join('') || '<div class="ev t">No events yet.</div>';
  } catch(e){}
}
loadCreds();
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
